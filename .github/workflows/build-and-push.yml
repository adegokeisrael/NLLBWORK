name: Build and Push NLLB RunPod Image

on:
  push:
    branches: [main]
    paths:
      - "handler.py"
      - "requirements.txt"
      - "Dockerfile"
      - ".github/workflows/build-and-push.yml"
  workflow_dispatch: {}   # lets you trigger a build manually from the Actions tab

env:
  IMAGE_NAME: nllb-yoruba

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # needed to push to GHCR

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Free up runner disk space
        # GitHub's hosted runners only have ~14GB free by default, which is
        # too tight once you add the CUDA base image + NLLB model weights.
        # This removes preinstalled toolchains we don't need to make room.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          docker system prune -af

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
